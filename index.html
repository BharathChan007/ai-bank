.btn-ghost:hover{background:#F9FAFB}
.btn-danger{background:#DC2626;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600}

/* ── Badges ── */

/* ── Provider tabs ── */

const VALID_USER = 'kavyasree0209';

const LETTERS = ['A','B','C','D'];

// Parses 429 retry-after from error message and throws with retryAfter property
function handleAPIError(res, errData) {
  const msg = errData.error?.message || `API ${res.status}`;
  const err = new Error(msg);
  if (res.status === 429) {
    const m = msg.match(/try again in ([\d.]+)s/i) || msg.match(/after ([\d.]+) second/i);
    err.retryAfter = m ? parseFloat(m[1]) : 60;
  }
  throw err;
}

// ═══════════════════════════════════════
// QUESTION GENERATION
// ═══════════════════════════════════════
const PROMPTS = {
  english: (exam, n) => `Generate exactly ${n} MCQ questions for ${exam} English Language section.
Include: 1 Reading Comprehension passage with 5 questions (include FULL passage in EACH of the 5 question texts), 5 Cloze Test (fill blank in sentence), 5 Error Detection (find grammatical error), 5 Fill in the Blanks, 5 Para Jumbles (rearrange P Q R S), 5 Vocabulary (synonym/antonym/usage).
Return ONLY valid JSON array, no markdown, no preamble:
[{"q":"question text","opts":["A) ...","B) ...","C) ...","D) ..."],"ans":"A","exp":"explanation","topic":"RC"}]`,

  quant: (exam, n) => `Generate exactly ${n} MCQ questions for ${exam} Numerical Ability section.
Include: 5 Number Series (find missing/next), 8 Simplification/Approximation (arithmetic expressions), 5 Quadratic Equations (find roots, compare x and y), 5 Data Interpretation (create ONE data table in text, then 5 questions referencing it), 7 Word Problems (SI, CI, Profit/Loss, Time-Work, Speed-Distance, Percentage, Average — one each), 5 misc.
Ensure all answers are mathematically correct. Show working in exp field.
Return ONLY valid JSON array, no markdown:
[{"q":"full question","opts":["A) ...","B) ...","C) ...","D) ..."],"ans":"B","exp":"step-by-step solution","topic":"DI"}]`,

  reasoning: (exam, n) => `Generate exactly ${n} MCQ questions for ${exam} Reasoning Ability section.
Include: 1 Linear Seating Arrangement puzzle (6 people, 5 questions — embed FULL clues in EVERY one of the 5 questions), 1 Circular Seating Arrangement (5 people, 5 questions — embed FULL clues in EVERY question), 5 Syllogisms (All/Some/No statements), 5 Coding-Decoding, 5 Inequalities (A>B=C chain type), 5 Blood Relations, 5 Direction-Distance, 5 misc (alphanumeric series, odd one out).
Return ONLY valid JSON array, no markdown:
[{"q":"full question with all clues","opts":["A) ...","B) ...","C) ...","D) ..."],"ans":"C","exp":"explanation","topic":"Seating"}]`
};

// Escapes bare control characters inside JSON string values (e.g. raw \n the model emits)
function fixControlChars(str) {
  let out = '', inStr = false, esc = false;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], code = str.charCodeAt(i);
    if (esc)          { out += ch; esc = false; continue; }
    if (ch === '\\' && inStr) { out += ch; esc = true; continue; }
    if (ch === '"')   { inStr = !inStr; out += ch; continue; }
    if (inStr && code < 0x20) {
      if      (code === 0x09) out += '\\t';
      else if (code === 0x0A) out += '\\n';
      else if (code === 0x0D) out += '\\r';
      else                    out += '\\u' + code.toString(16).padStart(4, '0');
      continue;
    }
    out += ch;
  }
  return out;
}

function parseQuestions(raw) {
  const clean = raw.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
  // Attempt 1: direct parse
  try { const a = JSON.parse(clean); if (Array.isArray(a)) return a; } catch {}
  // Extract the JSON array from surrounding text
  const m = clean.match(/\[[\s\S]*\]/);
  if (!m) throw new Error('No JSON array in response');
  const jsonStr = m[0];
  // Attempt 2: parse extracted block
  try { const a = JSON.parse(jsonStr); if (Array.isArray(a)) return a; } catch {}
  // Attempt 3: strip trailing commas (e.g. {...}, ] or {...}, })
  const noTrail = jsonStr.replace(/,\s*([\]}])/g, '$1');
  try { const a = JSON.parse(noTrail); if (Array.isArray(a)) return a; } catch {}
  // Attempt 4: fix bare control characters
  try { const a = JSON.parse(fixControlChars(jsonStr)); if (Array.isArray(a)) return a; } catch {}
  // Attempt 5: both fixes combined
  const a = JSON.parse(fixControlChars(noTrail));
  if (!Array.isArray(a)) throw new Error('Response is not a JSON array');
  return a;
}

async function generateSection(examName, sectionId, count) {
  const prompt = (PROMPTS[sectionId] || PROMPTS.reasoning)(examName, count);
  const provider = PROVIDERS[CURRENT_PROVIDER];
  const text = await provider.call(getCurrentApiKey(), getCurrentModel(), prompt);
  const arr = parseQuestions(text);
  if (!arr.length) throw new Error('Empty question array');
  return arr.slice(0, count).map((q, i) => ({ ...q, id: i, ans: (q.ans || 'A').toUpperCase().charAt(0) }));
}

};

function setState(patch) { Object.assign(state, patch); render(); }

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function secResults(examKey, questions, answers) {
  const exam = EXAMS[examKey];
  return exam.sections.map((s, si) => {
    let c = 0, w = 0, sk = 0;
    (questions[si] || []).forEach((q, qi) => {
      const a = (answers[si] || [])[qi];
      if (a === null || a === undefined) sk++;
      else if (a === q.ans) c++;
      else w++;
    });
    const score = c * exam.marking.correct + w * exam.marking.wrong;
    return { correct: c, wrong: w, skipped: sk, score, maxScore: s.count * exam.marking.correct, acc: c / (c + w || 1) };
  });
}

function totalResult(examKey, questions, answers) {
  const sr = secResults(examKey, questions, answers);
  const tot = { correct: 0, wrong: 0, skipped: 0, score: 0, maxScore: 0 };
  sr.forEach(r => { tot.correct += r.correct; tot.wrong += r.wrong; tot.skipped += r.skipped; tot.score += r.score; tot.maxScore += r.maxScore; });
  tot.pct = (tot.score / tot.maxScore) * 100;
  tot.acc = tot.correct / (tot.correct + tot.wrong || 1);
  return { sr, tot };
}

function gradeColor(pct) { return pct >= 70 ? '#059669' : pct >= 50 ? '#D97706' : '#DC2626'; }

// ═══════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  });
  return e;
}
const div = (a,...c) => el('div',a,...c);
const span = (a,...c) => el('span',a,...c);
const btn = (a,...c) => el('button',a,...c);
const p = (a,...c) => el('p',a,...c);

// ═══════════════════════════════════════
// TIMER
// ═══════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const si = state.secIdx;
    const tl = [...state.timesLeft];
    if (tl[si] > 0) tl[si]--;
    if (tl[si] === 0) {
      const next = si + 1;
      const exam = EXAMS[state.examKey];
      if (next < exam.sections.length) {
        state.secIdx = next; state.qIdx = 0;
        tl[next] = exam.sections[next].time;
      } else {
        clearInterval(timerInterval);
        submitTest();
        return;
      }
    }
    state.timesLeft = tl;
    render();
  }, 1000);
}

function submitTest() {
  clearInterval(timerInterval);
  const { examKey, questions, answers_live } = state;
  const exam = EXAMS[examKey];
  let c = 0, w = 0, sk = 0, sc = 0;
  exam.sections.forEach((s, si) => {
    (questions[si] || []).forEach((q, qi) => {
      const a = (answers_live[si] || [])[qi];
      if (a == null) sk++; else if (a === q.ans) { c++; sc += exam.marking.correct; } else { w++; sc += exam.marking.wrong; }
    });
  });
  const maxScore = exam.sections.reduce((a, s) => a + s.count, 0) * exam.marking.correct;
  const rec = { examName: exam.name, badge: exam.badge, date: Date.now(), score: sc, maxScore, correct: c, wrong: w, skipped: sk };
  const nh = [...state.history, rec].slice(-50);
  Storage.set('bankmock-history', nh);
  setState({ screen: 'analysis', answers: answers_live, history: nh, revSec: null, revQ: 0 });
}

                btn({

    );
    return container;
  }

  return buildScreen();
}

function startLoading(key) {
  state.examKey = key;
  const exam = EXAMS[key];
  state.loadStatus = exam.sections.map(() => 'pending');
  state.loadError = null;
  setState({ screen: 'loading' });
  (async () => {
    const allQs = [];
    for (let i = 0; i < exam.sections.length; i++) {
      const s = exam.sections[i];
      state.loadStatus = state.loadStatus.map((v, j) => j === i ? 'loading' : v);
      render();
      const MAX_RETRIES = 4;
      let attempt = 0;
      let succeeded = false;
      while (attempt <= MAX_RETRIES) {
        try {
          const qs = await generateSection(exam.name, s.id, s.count);
          allQs.push(qs);
          state.loadStatus = state.loadStatus.map((v, j) => j === i ? 'done' : v);
          state.loadRetryIn = 0; state.loadRetryMsg = null;
          render();
          succeeded = true;
          break;
        } catch (e) {
          if (e.retryAfter != null && attempt < MAX_RETRIES) {
            attempt++;
            const waitSec = Math.ceil(e.retryAfter) + 3;
            for (let t = waitSec; t > 0; t--) {
              state.loadRetryIn = t;
              state.loadRetryMsg = `Rate limited — retrying in ${t}s (attempt ${attempt}/${MAX_RETRIES})`;
              render();
              await new Promise(r => setTimeout(r, 1000));
            }
            state.loadRetryIn = 0; state.loadRetryMsg = null;
            state.loadStatus = state.loadStatus.map((v, j) => j === i ? 'loading' : v);
            render();
          } else {
            state.loadStatus = state.loadStatus.map((v, j) => j === i ? 'error' : v);
            state.loadError = `${s.name}: ${e.message}`;
            render(); return;
          }
        }
      }
    }
    // Init test state
    state.questions = allQs;
    state.secIdx = 0; state.qIdx = 0;
    state.answers_live = exam.sections.map(s => new Array(s.count).fill(null));
    state.flagged = exam.sections.map(s => new Array(s.count).fill(false));
    state.visited = exam.sections.map(s => new Array(s.count).fill(false));
    state.timesLeft = exam.sections.map(s => s.time);
    state.showPalette = false; state.confirmSubmit = false;
    setState({ screen: 'test' });
    startTimer();
  })();
}

  const { examKey, loadStatus, loadError, loadRetryIn, loadRetryMsg } = state;
  const exam = EXAMS[examKey];
  const prov = PROVIDERS[CURRENT_PROVIDER];
  const doneN = loadStatus.filter(s => s === 'done').length;
  const pct = loadStatus.length ? doneN / loadStatus.length * 100 : 0;
  const icons = { pending: '○', loading: '⟳', done: '✓', error: '✗' };
  const iconColors = { pending: '#9CA3AF', loading: '#93C5FD', done: '#34D399', error: '#F87171' };
  return div({ class: 'load-screen' },
    div({ class: 'load-box' },
      div({ class: 'load-icon' }, loadRetryIn > 0 ? '⏳' : '🤖'),
      el('h2', { style: { fontSize: '22px', fontWeight: 700, marginBottom: '6px' } },
        loadRetryIn > 0 ? 'Rate limit — waiting…' : 'Generating questions'
      ),

        ? div(null,

            div({ class: 'pb-bg', style: { height: '6px', marginBottom: '20px' } },
              div({ class: 'pb-fill', style: { width: '100%', background: '#F59E0B', animation: 'pulse 1s infinite' } })
            )
          )
        : div(null,
            p({ style: { opacity: .6, marginBottom: '4px', fontSize: '13px' } }, `Crafting fresh questions for ${exam.name}…`),
            p({ style: { opacity: .4, marginBottom: '20px', fontSize: '11px' } }, `via ${prov.name} · ${getCurrentModel()}`),
            div({ class: 'pb-bg', style: { height: '6px', marginBottom: '20px' } },
              div({ class: 'pb-fill', style: { width: pct + '%', background: '#F59E0B' } })
            )
          ),

        const st = loadStatus[i] || 'pending';
        return div({ class: 'load-section' },
          span({ style: { fontSize: '18px', color: iconColors[st], animation: st === 'loading' ? 'spin .8s linear infinite' : '', display: 'inline-block', width: '24px', textAlign: 'center' } }, icons[st]),
          div({ style: { flex: 1 } },
            div({ style: { fontWeight: 600, fontSize: '14px' } }, s.name),
            div({ style: { opacity: .5, fontSize: '12px' } }, s.count + ' questions')
          ),
          span({ style: { fontSize: '12px', opacity: .6 } }, st === 'loading' ? 'Generating…' : st === 'done' ? 'Ready' : st === 'error' ? 'Failed' : 'Queued')
        );
      }),
      loadError && div({ style: { marginTop: '14px', padding: '12px', background: 'rgba(239,68,68,.2)', border: '1px solid rgba(239,68,68,.4)', borderRadius: '8px', fontSize: '13px', color: '#FCA5A5' } },

      )
    )
  );
}

function renderTest() {
  const { examKey, questions, answers_live, flagged, visited, timesLeft, secIdx, qIdx, showPalette, confirmSubmit } = state;
  const exam = EXAMS[examKey];
  const sec = exam.sections[secIdx];
  const tLeft = timesLeft[secIdx];
  const tPct = tLeft / sec.time;
  const timerCls = 'timer' + (tPct > 0.4 ? '' : tPct > 0.2 ? ' warn' : ' danger');
  const curQ = (questions[secIdx] || [])[qIdx];
  if (!curQ) return div(null, 'Loading...');

  const markVisited = () => {
    if (!visited[secIdx][qIdx]) { visited[secIdx][qIdx] = true; }
  };
  markVisited();

  const setAns = l => {
    answers_live[secIdx][qIdx] = answers_live[secIdx][qIdx] === l ? null : l;
    render();
  };
  const toggleFlag = () => { flagged[secIdx][qIdx] = !flagged[secIdx][qIdx]; render(); };
  const goTo = (si, qi) => {
    state.secIdx = si; state.qIdx = qi;
    visited[si][qi] = true;
    render();
  };
  const navPrev = () => {
    if (qIdx > 0) goTo(secIdx, qIdx - 1);
    else if (secIdx > 0) goTo(secIdx - 1, exam.sections[secIdx - 1].count - 1);
  };
  const navNext = () => {
    if (qIdx < sec.count - 1) goTo(secIdx, qIdx + 1);
    else if (secIdx < exam.sections.length - 1) goTo(secIdx + 1, 0);
  };
  const secAns = si => (answers_live[si] || []).filter(a => a !== null).length;
  const qCls = (si, qi) => {
    if (si === secIdx && qi === qIdx) return 'qp-btn cur';
    if (flagged[si][qi]) return 'qp-btn flagged';
    if (answers_live[si][qi] !== null) return 'qp-btn ans';
    if (visited[si][qi]) return 'qp-btn vis';
    return 'qp-btn';
  };

  return div({ style: { display: 'flex', flexDirection: 'column', height: '100vh', background: '#F0F4F8', position: 'relative' } },
    // Top bar
    div({ class: 'topbar' },
      div({ style: { display: 'flex', gap: '4px', flex: 1, overflowX: 'auto' } },
        exam.sections.map((s, i) =>
          btn({ class: 'sec-tab' + (i === secIdx ? ' active' : ''), onClick: () => goTo(i, 0) },
            s.name.split(' ')[0],
            span({ style: { marginLeft: '4px', opacity: .6, fontSize: '11px' } }, `(${secAns(i)}/${s.count})`)
          )
        )
      ),
      span({ class: timerCls }, fmt(tLeft)),
      btn({ class: 'btn-danger', style: { fontSize: '12px', padding: '5px 12px', marginLeft: '4px' }, onClick: () => { state.confirmSubmit = true; render(); } }, 'Submit')
    ),
    // Sub-bar
    div({ style: { background: '#fff', borderBottom: '1px solid #E5E7EB', padding: '6px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
      span({ style: { fontSize: '12px', color: '#6B7280' } },
        `${sec.name} — Q ${qIdx + 1} of ${sec.count}`,
        flagged[secIdx][qIdx] ? span({ class: 'badge badge-amber', style: { marginLeft: '8px' } }, '🚩 Flagged') : null
      ),
      div({ style: { display: 'flex', gap: '6px' } },
        btn({ class: 'btn-ghost', style: { fontSize: '12px', padding: '4px 10px' }, onClick: toggleFlag }, flagged[secIdx][qIdx] ? 'Unflag' : 'Flag'),
        btn({ class: 'btn-ghost', style: { fontSize: '12px', padding: '4px 10px' }, onClick: () => { state.showPalette = !state.showPalette; render(); } }, '🔢 Palette')
      )
    ),
    // Content row
    div({ style: { flex: 1, display: 'flex', overflow: 'hidden' } },
      // Question area
      div({ style: { flex: 1, overflow: 'auto', padding: '16px' } },
        div({ class: 'card', style: { marginBottom: '12px' } },
          div({ style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '12px' } },
            span({ class: 'badge badge-blue' }, `Q${qIdx + 1}${curQ.topic ? ` · ${curQ.topic}` : ''}`),
            span({ style: { fontSize: '12px', color: '#9CA3AF' } }, '+1 / –0.25')
          ),
          p({ style: { fontSize: '14px', lineHeight: '1.8', color: '#111827', whiteSpace: 'pre-wrap', margin: 0 } }, curQ.q)
        ),
        (curQ.opts || []).map((opt, oi) => {
          const l = LETTERS[oi];
          const isSel = answers_live[secIdx][qIdx] === l;
          return btn({ class: 'opt-btn' + (isSel ? ' selected' : ''), onClick: () => setAns(l) },
            span({ class: 'letter-badge' }, l),
            span({ style: { flex: 1 } }, opt.replace(/^[A-D]\)\s*/, ''))
          );
        }),
        div({ style: { display: 'flex', gap: '10px', marginTop: '18px', paddingBottom: '16px' } },
          btn({ class: 'btn-ghost', style: { flex: 1 }, onClick: navPrev, disabled: secIdx === 0 && qIdx === 0 }, '← Prev'),
          btn({ class: 'btn-primary', style: { flex: 1 }, onClick: navNext, disabled: secIdx === exam.sections.length - 1 && qIdx === sec.count - 1 }, 'Next →')
        )
      ),
      // Palette sidebar
      showPalette && div({ style: { width: '190px', background: '#fff', borderLeft: '1px solid #E5E7EB', padding: '12px', overflow: 'auto', flexShrink: 0 } },
        div({ style: { marginBottom: '10px' } },
          [['qp-btn ans', 'Answered'], ['qp-btn flagged', 'Flagged'], ['qp-btn cur', 'Current'], ['qp-btn vis', 'Visited']].map(([cls, l]) =>
            div({ style: { display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '4px' } },
              div({ class: cls, style: { width: '16px', height: '16px', fontSize: '8px', pointerEvents: 'none' } }),
              span({ style: { fontSize: '11px', color: '#6B7280' } }, l)
            )
          )
        ),
        exam.sections.map((s, si) =>
          div({ style: { marginBottom: '12px' } },
            div({ style: { fontSize: '10px', fontWeight: 700, color: '#1B4F8A', marginBottom: '5px', letterSpacing: '.5px' } }, s.name.slice(0, 10).toUpperCase()),
            div({ style: { display: 'flex', flexWrap: 'wrap', gap: '3px' } },
              Array.from({ length: s.count }, (_, qi) =>
                btn({ class: qCls(si, qi), onClick: () => goTo(si, qi) }, qi + 1)
              )
            )
          )
        )
      )
    ),
    // Submit confirm modal
    confirmSubmit && div({ class: 'modal-back' },
      div({ class: 'card', style: { width: 'min(90vw,340px)', padding: '22px' } },
        el('h3', { style: { fontSize: '16px', fontWeight: 700, marginBottom: '6px' } }, 'Submit test?'),
        p({ style: { fontSize: '13px', color: '#6B7280', marginBottom: '14px' } }, 'This cannot be undone.'),
        exam.sections.map((s, si) =>
          div({ style: { display: 'flex', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid #F3F4F6', fontSize: '13px' } },
            span({ style: { color: '#374151' } }, s.name),
            span(null, el('strong', { style: { color: '#059669' } }, secAns(si)), span({ style: { color: '#9CA3AF' } }, '/' + s.count))
          )
        ),
        div({ style: { display: 'flex', gap: '8px', marginTop: '16px' } },
          btn({ class: 'btn-ghost', style: { flex: 1 }, onClick: () => { state.confirmSubmit = false; render(); } }, 'Continue'),
          btn({ class: 'btn-danger', style: { flex: 1 }, onClick: () => submitTest() }, 'Submit now')
        )
      )
    )
  );
}

  const exam = EXAMS[examKey];
  const { sr, tot } = totalResult(examKey, questions, answers);

  if (revSec !== null) {
    const q = (questions[revSec] || [])[revQ];
    const ua = (answers[revSec] || [])[revQ];
    const ok = ua === q.ans; const skip = ua == null;
    const s = exam.sections[revSec];
    return div({ style: { minHeight: '100vh', background: '#F0F4F8' } },
      div({ class: 'topbar', style: { justifyContent: 'space-between' } },
        btn({ class: 'btn-ghost', style: { fontSize: '13px', padding: '5px 10px' }, onClick: () => { state.revSec = null; render(); } }, '← Back'),
        span({ style: { fontSize: '13px', color: '#6B7280' } }, `${s.name} · Q${revQ + 1}/${s.count}`),
        span({ class: 'badge ' + (skip ? 'badge-gray' : ok ? 'badge-green' : 'badge-red') }, skip ? 'Skipped' : ok ? `+${exam.marking.correct}` : exam.marking.wrong)
      ),
      div({ style: { maxWidth: '660px', margin: '0 auto', padding: '16px' } },
        div({ class: 'card', style: { marginBottom: '10px' } },
          span({ class: 'badge badge-blue', style: { marginBottom: '10px', display: 'inline-block' } }, `Q${revQ + 1}${q.topic ? ` · ${q.topic}` : ''}`),
          p({ style: { fontSize: '14px', lineHeight: '1.8', whiteSpace: 'pre-wrap', margin: 0 } }, q.q)
        ),
        (q.opts || []).map((opt, oi) => {
          const l = LETTERS[oi]; const isCorr = l === q.ans; const isUser = l === ua;
          let cls = 'opt-btn';

          return div({ class: cls, style: { cursor: 'default' } },
            span({ class: 'letter-badge' }, l),
            span({ style: { flex: 1 } }, opt.replace(/^[A-D]\)\s*/, '')),
            isCorr ? span({ style: { color: '#059669', marginLeft: '4px', fontSize: '12px' } }, '✓ Correct') : null,
            isUser && !ok ? span({ style: { color: '#DC2626', marginLeft: '4px', fontSize: '12px' } }, '✗ Your answer') : null
          );
        }),
        q.exp && div({ style: { background: '#EFF6FF', border: '1px solid #BFDBFE', borderRadius: '8px', padding: '12px', marginTop: '4px' } },
          div({ style: { fontSize: '12px', fontWeight: 700, color: '#1B4F8A', marginBottom: '5px' } }, '💡 Explanation'),
          p({ style: { fontSize: '13px', lineHeight: '1.6', margin: 0 } }, q.exp)
        ),
        div({ class: 'card', style: { marginTop: '12px' } },
          div({ style: { fontSize: '11px', color: '#9CA3AF', fontWeight: 600, marginBottom: '8px' } }, 'JUMP TO QUESTION'),
          div({ style: { display: 'flex', flexWrap: 'wrap', gap: '4px' } },
            Array.from({ length: s.count }, (_, qi) => {

          const r = sr[si]; const pct = Math.max(0, (r.score / r.maxScore) * 100); const c = gradeColor(pct);
          return div({ style: { marginBottom: '14px', paddingBottom: '14px', borderBottom: si < exam.sections.length - 1 ? '1px solid #F3F4F6' : 'none' } },
            div({ style: { display: 'flex', justifyContent: 'space-between', marginBottom: '7px' } },
              span({ style: { fontWeight: 600, fontSize: '13px' } }, s.name),
              span({ style: { fontWeight: 700, color: c, fontSize: '14px' } }, `${r.score.toFixed(2)}/${r.maxScore}`)
            ),
            div({ class: 'pb-bg', style: { height: '6px', marginBottom: '7px' } },

            ),

      ),
      div({ style: { display: 'flex', gap: '8px' } },
        btn({ class: 'btn-ghost', style: { flex: 1, padding: '13px', fontSize: '15px' }, onClick: () => setState({ screen: 'home' }) }, '🏠 Home'),
        btn({ class: 'btn-primary', style: { flex: 1, padding: '13px', fontSize: '15px' }, onClick: () => startLoading(examKey) }, '🔄 New test')
      )
    )
  );
}

function renderHistory() {
  const { history } = state;
  const avg = history.length ? history.reduce((a, h) => a + (h.score / h.maxScore) * 100, 0) / history.length : 0;
  const best = history.length ? Math.max(...history.map(h => (h.score / h.maxScore) * 100)) : 0;
  return div({ style: { minHeight: '100vh', background: '#F0F4F8' } },
    div({ class: 'topbar' },
      btn({ class: 'btn-ghost', style: { fontSize: '13px', padding: '5px 10px' }, onClick: () => setState({ screen: 'home' }) }, '← Back'),
      span({ style: { fontWeight: 700, fontSize: '15px', marginLeft: '8px' } }, 'Test History')
    ),
    history.length === 0
      ? div({ style: { textAlign: 'center', padding: '80px 20px', color: '#9CA3AF' } },
        div({ style: { fontSize: '48px', marginBottom: '12px' } }, '📋'),
        div({ style: { fontSize: '16px', fontWeight: 600 } }, 'No tests yet'),
        div({ style: { fontSize: '13px', marginTop: '4px' } }, 'Complete your first mock to see history here')
      )
      : div({ style: { maxWidth: '560px', margin: '0 auto', padding: '20px 14px' } },
        history.length >= 2 && div({ style: { display: 'flex', gap: '8px', marginBottom: '14px' } },
          [
            { v: history.length, l: 'Tests done', c: '#1B4F8A' },
            { v: `${avg.toFixed(1)}%`, l: 'Average', c: '#D97706' },
            { v: `${best.toFixed(1)}%`, l: 'Best', c: '#059669' }
          ].map(({ v, l, c }) =>
            div({ class: 'card', style: { flex: 1, textAlign: 'center', padding: '10px 8px' } },
              div({ style: { fontSize: '18px', fontWeight: 700, color: c } }, v),
              div({ style: { fontSize: '11px', color: '#9CA3AF', marginTop: '2px' } }, l)
            )
          )
        ),
        history.slice().reverse().map((h, i) => {
          const pct = (h.score / h.maxScore) * 100;
          return div({ class: 'card', style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '8px' } },
            div(null,
              div({ style: { display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '3px' } },
                span({ class: 'badge badge-blue', style: { fontSize: '10px' } }, h.badge),
                span({ style: { fontSize: '13px', fontWeight: 600 } }, h.examName)
              ),
              div({ style: { fontSize: '11px', color: '#9CA3AF' } }, new Date(h.date).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })),
              div({ style: { display: 'flex', gap: '10px', marginTop: '5px', fontSize: '12px' } },
                span({ style: { color: '#059669' } }, `✓ ${h.correct}`),
                span({ style: { color: '#DC2626' } }, `✗ ${h.wrong}`),
                span({ style: { color: '#9CA3AF' } }, `— ${h.skipped}`)
              )
            ),
            div({ style: { textAlign: 'right' } },
              div({ style: { fontSize: '20px', fontWeight: 700, color: gradeColor(pct) } }, h.score.toFixed(2)),
              div({ style: { fontSize: '11px', color: '#9CA3AF' } }, `/${h.maxScore} · ${pct.toFixed(0)}%`)
            )
          );
        })
      )
  );
}

// ═══════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════
function render() {
  const root = document.getElementById('root');
  const screens = { login: renderLogin, home: renderHome, apikey: renderApiKey, loading: renderLoading, test: renderTest, analysis: renderAnalysis, history: renderHistory };
  const fn = screens[state.screen];
  if (!fn) return;
  root.innerHTML = '';
  root.appendChild(fn());
}

render();
</script>
</body>
</html>
